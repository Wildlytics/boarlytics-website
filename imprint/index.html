<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impressum – Boarlytics</title>
<style>
:root{--bg:#0a0b0a;--line:#2a2d2a;--hair:rgba(255,255,255,.07);--lime:#93d13f;--text:#f4f5f2;--muted2:#6c726c;
--sans:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,system-ui,sans-serif;--mono:"Cascadia Code",Consolas,ui-monospace,monospace;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.65;font-size:16px;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:10;background:rgba(10,11,10,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--hair)}
.head{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 22px}
.brand img{height:32px}
.langs{display:flex;gap:4px}
.langs button{background:none;border:1px solid var(--line);color:var(--muted2);font-family:var(--mono);font-size:.72rem;padding:5px 9px;border-radius:6px;cursor:pointer}
.langs button.active{background:var(--lime);color:#0a0b0a;font-weight:700;border-color:var(--lime)}
main{max-width:820px;margin:0 auto;padding:44px 22px 60px}
.legal h1{font-size:2rem;font-weight:800;margin-bottom:4px}
.legal h2{font-size:1.15rem;font-weight:800;color:var(--lime);margin:26px 0 8px;border-top:1px solid var(--line);padding-top:20px}
.legal h2:first-of-type{border-top:none;padding-top:0}
.legal .meta{font-family:var(--mono);font-size:.78rem;color:var(--muted2);margin-bottom:18px}
.legal p{margin:8px 0;color:#d5d9d3} .legal ul{margin:8px 0 8px 22px;color:#d5d9d3} .legal li{margin:5px 0}
.legal a{color:var(--lime)}
footer{border-top:1px solid var(--hair);margin-top:40px}
.foot{max-width:820px;margin:0 auto;padding:26px 22px;display:flex;gap:18px;flex-wrap:wrap;font-size:.88rem}
.foot a{color:#b7bcb6;text-decoration:none} .foot a:hover{color:#fff}
</style>
</head>
<body>
<header><div class="head">
  <a href="/"><img class="brand" src="/boarlytics-logo.png" alt="Boarlytics" style="height:32px"></a>
  <div class="langs">
    <button data-l="de" onclick="setLang('de')">DE</button>
    <button data-l="en" onclick="setLang('en')">EN</button>
    <button data-l="fr" onclick="setLang('fr')">FR</button>
  </div>
</div></header>
<main><div class="legal" id="content"></div></main>
<footer><div class="foot" id="foot"></div></footer>
<script>
const DOC={"de": "<h1>Impressum</h1><div class=\"meta\">Angaben gemäß § 5 TMG</div>\n<h2>Anbieter</h2><p>Boarlytics<br>Frieder Baumann<br>Softwareentwicklung Wildtiermanagement</p>\n<p>c/o flexdienst – #20469<br>Kurt-Schumacher-Straße 76<br>67663 Kaiserslautern<br>Deutschland</p>\n<h2>Kontakt</h2><p>E-Mail: <a href=\"mailto:info@boarlytics.com\">info@boarlytics.com</a></p>\n<h2>Verantwortlich für den Inhalt</h2><p>Frieder Baumann (Anschrift wie oben)</p>\n<h2>Umsatzsteuer-Identifikationsnummer</h2><p>USt-IdNr. gemäß § 27a UStG:<br>DE447007300</p><h2>Online-Streitbeilegung</h2><p>Die Europäische Kommission stellt eine Plattform zur Online-Streitbeilegung bereit: <a href=\"https://ec.europa.eu/consumers/odr\">ec.europa.eu/consumers/odr</a>. Wir sind nicht verpflichtet und nicht bereit, an Streitbeilegungsverfahren vor einer Verbraucherschlichtungsstelle teilzunehmen.</p>\n", "en": "<h1>Legal Notice</h1><div class=\"meta\">Information pursuant to § 5 German Telemedia Act (TMG)</div>\n<h2>Provider</h2><p>Boarlytics<br>Frieder Baumann<br>Softwareentwicklung Wildtiermanagement</p>\n<p>c/o flexdienst – #20469<br>Kurt-Schumacher-Straße 76<br>67663 Kaiserslautern<br>Germany</p>\n<h2>Contact</h2><p>Email: <a href=\"mailto:info@boarlytics.com\">info@boarlytics.com</a></p>\n<h2>Responsible for content</h2><p>Frieder Baumann (address as above)</p>\n<h2>VAT Identification Number</h2><p>VAT ID pursuant to § 27a UStG:<br>DE447007300</p><h2>Online Dispute Resolution</h2><p>EU ODR platform: <a href=\"https://ec.europa.eu/consumers/odr\">ec.europa.eu/consumers/odr</a>. We are not obliged/willing to participate in consumer arbitration.</p>\n", "fr": "<h1>Mentions légales</h1><div class=\"meta\">Informations conformément au § 5 TMG (Allemagne)</div>\n<h2>Prestataire</h2><p>Boarlytics<br>Frieder Baumann<br>Softwareentwicklung Wildtiermanagement</p>\n<p>c/o flexdienst – #20469<br>Kurt-Schumacher-Straße 76<br>67663 Kaiserslautern<br>Allemagne</p>\n<h2>Contact</h2><p>E-mail : <a href=\"mailto:info@boarlytics.com\">info@boarlytics.com</a></p>\n<h2>Responsable du contenu</h2><p>Frieder Baumann (adresse ci-dessus)</p>\n<h2>Numéro d'identification TVA</h2><p>N° de TVA (§ 27a UStG) :<br>DE447007300</p><h2>Règlement en ligne des litiges</h2><p>Plateforme RLL de l'UE : <a href=\"https://ec.europa.eu/consumers/odr\">ec.europa.eu/consumers/odr</a>. Nous ne sommes pas tenus ni disposés à participer à une conciliation.</p>\n"};
const LAB={"de": {"back": "Zur Startseite", "agb": "AGB", "ds": "Datenschutz", "imp": "Impressum"}, "en": {"back": "Home", "agb": "Terms", "ds": "Privacy", "imp": "Legal Notice"}, "fr": {"back": "Accueil", "agb": "CGU", "ds": "Confidentialité", "imp": "Mentions légales"}};
let lang="de";
function render(){
  document.getElementById('content').innerHTML=DOC[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('active',b.dataset.l===lang));
  const L=LAB[lang];
  document.getElementById('foot').innerHTML='<a href="/">← '+L.back+'</a><a href="/agb">'+L.agb+'</a><a href="/datenschutz">'+L.ds+'</a><a href="/imprint">'+L.imp+'</a>';
}
function setLang(l){lang=l;render();}
render();
</script>
</body>
</html>
