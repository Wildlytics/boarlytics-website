const DOC={"de": "<h1>Allgemeine Geschäftsbedingungen (AGB)</h1>\n<div class=\"meta\">Boarlytics · Frieder Baumann, Softwareentwicklung Wildtiermanagement · Stand: Mai 2026 · Version 1.0</div>\n<h2>§ 1 Geltungsbereich und Vertragsparteien</h2>\n<p>Diese Allgemeinen Geschäftsbedingungen (AGB) regeln die Nutzung der mobilen Anwendung „Boar Forecast\" (nachfolgend „App\"), angeboten von Boarlytics, Frieder Baumann, Softwareentwicklung Wildtiermanagement (nachfolgend „Anbieter\").</p>\n<p>Vertragspartner des Nutzers ist ausschließlich der Anbieter. Google LLC (Google Play) und Apple Inc. (App Store) sind Vertriebsplattformen, keine Vertragspartner für die App-Nutzung selbst.</p>\n<h2>§ 2 Vertragsschluss und Zustimmung</h2>\n<p>Der Nutzungsvertrag kommt zustande, wenn der Nutzer sich in der App registriert und durch aktives Ankreuzen einer Checkbox diesen AGB sowie der Datenschutzerklärung zustimmt. Eine vorausgefüllte Checkbox ist nicht zulässig.</p>\n<p>Die Nutzung der App ohne Zustimmung zu diesen AGB ist nicht möglich. Minderjährige (unter 18 Jahren) dürfen die App nicht nutzen. Der Nutzer bestätigt mit der Registrierung, dass er das 18. Lebensjahr vollendet hat. Die Nutzung der App setzt in der Regel eine gültige Jagdlizenz oder vergleichbare jagdrechtliche Berechtigung voraus; der Anbieter ist nicht zur Prüfung dieser Voraussetzung verpflichtet.</p>\n<h2>§ 3 Leistungsbeschreibung und Lizenz</h2>\n<p>Der Anbieter gewährt dem Nutzer eine einfache, nicht übertragbare, widerrufliche Lizenz zur Nutzung der App auf eigenen Endgeräten für private oder gewerbliche jagdliche Zwecke. Die App umfasst folgende Tarifstufen:</p>\n<ul><li><b>Free:</b> Basisprognose für bis zu 2 Kirrungen, kostenlos, ohne Laufzeitbindung</li>\n<li><b>Wind</b> (Einmalkauf, EUR 17,99 inkl. MwSt.): Windanzeige und unbegrenzte Anzahl von Kirrungen — einmalige Lizenzgebühr für die Nutzung während des aktiven Dienstbetriebs</li>\n<li><b>PRO</b> (Abonnement, EUR 2,50/Monat inkl. MwSt.): DeepForecast, Kirrung teilen, Push-Benachrichtigungen — monatlich kündbar</li></ul>\n<p>Zukünftige kostenpflichtige Funktionen (insbesondere Wildkamera-Integration und Kirrungsautomat-Steuerung) werden bei Einführung separat angeboten und sind von diesen AGB erfasst, sobald der Nutzer sie aktiviert.</p>\n<h2>§ 4 Einmalkauf „Wind\" — Lizenzcharakter und Widerrufsrecht</h2>\n<p>Der Einmalkauf „Wind\" begründet keine dauerhafte Eigentümerschaft an einer Software, sondern eine Lizenz zur Nutzung der Wind-Funktion für die Dauer des aktiven Dienstbetriebs des Anbieters.</p>\n<p>Das gesetzliche 14-tägige Widerrufsrecht des Verbrauchers erlischt gemäß § 356 Abs. 5 BGB bei digitalen Inhalten, deren Lieferung unmittelbar nach Kaufabschluss beginnt, sofern der Nutzer ausdrücklich zustimmt und bestätigt, dass er damit sein Widerrufsrecht verliert. Diese Bestätigung erfolgt durch eine Pflicht-Checkbox im Kaufdialog der App.</p>\n<p>Nach Ablauf der gesetzlichen Widerrufsfrist — oder nach Erlöschen des Widerrufsrechts infolge der Bestätigung — besteht kein Rückgabe- oder Erstattungsanspruch, auch nicht im Falle der Einstellung des Dienstes nach Ablauf der in § 9 genannten Ankündigungsfrist.</p>\n<h2>§ 5 PRO-Abonnement — Laufzeit, Verlängerung und Kündigung</h2>\n<p>Das PRO-Abonnement wird monatlich abgerechnet und verlängert sich automatisch um jeweils einen weiteren Monat, sofern es nicht vor dem Ende des laufenden Abrechnungszeitraums gekündigt wird.</p>\n<p>Die Kündigung erfolgt ausschließlich über die jeweilige App-Store-Plattform:</p>\n<ul><li>Android: Google Play Store → Einstellungen → Abonnements → Boar Forecast → Kündigen</li>\n<li>iOS: Einstellungen → [Apple-ID] → Abonnements → Boar Forecast → Kündigen</li></ul>\n<p>Nach einer Kündigung bleiben PRO-Funktionen bis zum Ende des bereits bezahlten Abrechnungszeitraums verfügbar. Danach wird das Konto automatisch auf den Free-Tarif zurückgestuft. Bereits geteilte Kirrungen werden eingefroren (lesbar, nicht editierbar), bis der Nutzer das Teilen beendet oder erneut ein PRO-Abonnement abschließt.</p>\n<p>Rückerstattungen anteiliger Abo-Gebühren bei vorzeitiger Kündigung sind ausgeschlossen, es sei denn, dies ist gesetzlich vorgeschrieben.</p>\n<h2>§ 6 Preise und Zahlungsbedingungen</h2>\n<p>Alle angegebenen Preise sind Endpreise inklusive der gesetzlichen Umsatzsteuer. Die Zahlungsabwicklung erfolgt über Google Play Billing (Android) bzw. Apple In-App Purchase (iOS). Der Anbieter hat keinen Zugriff auf Zahlungsdaten des Nutzers.</p>\n<p>Der Anbieter behält sich das Recht vor, Preise anzupassen. Preiserhöhungen für bestehende PRO-Abonnements werden mindestens 30 Tage vor Inkrafttreten per In-App-Benachrichtigung angekündigt. Der Nutzer hat in diesem Fall das Recht, das Abonnement zum Ende des laufenden Abrechnungszeitraums zu kündigen.</p>\n<h2>§ 7 Prognosen — Keine Erfolgsgarantie</h2>\n<p>Die App berechnet Besuchswahrscheinlichkeiten auf Basis historischer Jagd- und Wetterdaten mittels eines statistischen Modells. Die Prognosen sind Wahrscheinlichkeitsschätzungen und stellen keine Garantie für den Eintritt eines bestimmten Ereignisses dar. Der Anbieter übernimmt keine Haftung für ausbleibende Wildbesuche oder Entscheidungen, die auf Grundlage der App-Daten getroffen werden.</p>\n<h2>§ 8 Verfügbarkeit — Offline-Betrieb und Systemausfälle</h2>\n<p>Der Anbieter strebt eine hohe Verfügbarkeit der App und des Backends an, übernimmt jedoch keine Garantie für einen unterbrechungsfreien Betrieb. Bei technisch bedingter Nichtverfügbarkeit des Backends zeigt die App zuletzt zwischengespeicherte Daten an (Offline-Modus). Neue Prognoseberechnungen sind in diesem Zeitraum nicht möglich.</p>\n<p>Der Nutzer hat keinen Anspruch auf:</p>\n<ul><li>Ununterbrochene Verfügbarkeit des Backends oder der Forecast-Funktion</li>\n<li>Erstattung von Abonnementgebühren bei technisch bedingten Ausfällen, solange diese nicht auf grober Fahrlässigkeit oder Vorsatz des Anbieters beruhen</li>\n<li>Schadensersatz für Datenverlust durch Verbindungsprobleme, Gerätefehler oder höhere Gewalt</li></ul>\n<h2>§ 9 Einstellung des Dienstes</h2>\n<p>Der Anbieter behält sich das Recht vor, den Dienst (App und Backend) jederzeit einzustellen. Im Falle einer dauerhaften Einstellung gilt:</p>\n<ul><li>Ankündigungsfrist: mindestens 30 Tage vor Einstellung per In-App-Benachrichtigung und E-Mail an die hinterlegte Adresse</li>\n<li>Datenexport: dem Nutzer wird vor der Einstellung die Möglichkeit gegeben, seine gespeicherten Daten zu exportieren</li>\n<li>Keine Erstattung: für den Wind-Einmalkauf besteht nach Ablauf der gesetzlichen Widerrufsfrist kein Erstattungsanspruch; PRO-Abonnements werden anteilig für den nicht genutzten Zeitraum nach Einstellung erstattet</li>\n<li>Kein Schadensersatz: der Nutzer hat keinen weitergehenden Schadensersatzanspruch aufgrund der Einstellung</li></ul>\n<p>Diese Regelung gilt entsprechend für vorübergehende Wartungsunterbrechungen, jedoch ohne Pflicht zur Ankündigung bei ungeplanten Ausfällen.</p>\n<h2>§ 10 Nutzerpflichten</h2>\n<p>Der Nutzer verpflichtet sich:</p>\n<ul><li>zur korrekten und vollständigen Eingabe von Jagddaten, soweit dies für valide Prognosen relevant ist</li>\n<li>seine Zugangsdaten (E-Mail, Passwort) vor dem Zugriff Dritter zu schützen</li>\n<li>das Nutzerkonto nicht an Dritte weiterzugeben oder zu übertragen</li>\n<li>keine automatisierten Abfragen der App-API durchzuführen</li>\n<li>die App nicht für rechtswidrige Zwecke zu verwenden</li></ul>\n<p>Der Anbieter behält sich das Recht vor, Nutzerkonten bei schwerwiegenden oder wiederholten Verstößen gegen diese Pflichten zu sperren oder zu löschen.</p>\n<h2>§ 11 Datenschutz</h2>\n<p>Die Verarbeitung personenbezogener Daten erfolgt gemäß der gesonderten Datenschutzerklärung, die in der App und unter <a href=\"https://boarlytics.com/datenschutz\">boarlytics.com/datenschutz</a> abrufbar ist. Die Datenschutzerklärung ist Bestandteil dieser AGB.</p>\n<h2>§ 12 Änderungen der AGB</h2>\n<p>Der Anbieter ist berechtigt, diese AGB mit einer Ankündigungsfrist von mindestens 30 Tagen zu ändern. Die Ankündigung erfolgt per In-App-Benachrichtigung. Bei der nächsten App-Nutzung nach Ablauf der Ankündigungsfrist wird dem Nutzer die neue Version zur aktiven Zustimmung vorgelegt. Widerspricht der Nutzer nicht oder stimmt er aktiv zu, gelten die geänderten AGB als angenommen. Bei Widerspruch ist der Anbieter berechtigt, den Nutzungsvertrag zum Ende der Ankündigungsfrist zu kündigen; PRO-Abonnements werden in diesem Fall anteilig erstattet.</p>\n<h2>§ 13 Haftungsbeschränkung</h2>\n<p>Die Haftung des Anbieters ist auf Vorsatz und grobe Fahrlässigkeit beschränkt. Dies gilt nicht bei der Verletzung von Leben, Körper oder Gesundheit sowie bei der Verletzung wesentlicher Vertragspflichten (Kardinalpflichten). Bei der Verletzung wesentlicher Vertragspflichten ohne Vorsatz oder grobe Fahrlässigkeit ist die Haftung auf den vertragstypischen, vorhersehbaren Schaden begrenzt. Die Haftung nach dem Produkthaftungsgesetz bleibt unberührt.</p>\n<h2>§ 14 Anzuwendendes Recht, Gerichtsstand und Streitbeilegung</h2>\n<p>Es gilt das Recht der Bundesrepublik Deutschland unter Ausschluss des UN-Kaufrechts (CISG). Gerichtsstand für Kaufleute und juristische Personen des öffentlichen Rechts ist Kaiserslautern. Für Verbraucher gilt der gesetzliche Gerichtsstand.</p>\n<p>Die Europäische Kommission stellt eine Plattform zur Online-Streitbeilegung (OS) bereit: <a href=\"https://ec.europa.eu/consumers/odr\">ec.europa.eu/consumers/odr</a>. Der Anbieter ist nicht verpflichtet und nicht bereit, an Streitbeilegungsverfahren vor einer Verbraucherschlichtungsstelle teilzunehmen, es sei denn, dies ist gesetzlich vorgeschrieben.</p>\n<h2>§ 15 Salvatorische Klausel</h2>\n<p>Sollte eine Bestimmung dieser AGB unwirksam oder undurchführbar sein oder werden, bleibt die Wirksamkeit der übrigen Bestimmungen unberührt. Die unwirksame Bestimmung wird durch eine wirksame ersetzt, die dem wirtschaftlichen Zweck der unwirksamen Bestimmung am nächsten kommt.</p>", "en": "<h1>Terms of Service (ToS)</h1>\n<div class=\"meta\">Boarlytics · Frieder Baumann · May 2026 · Version 1.0</div>\n<h2>§ 1 Scope and Parties</h2>\n<p>These Terms of Service govern the use of the mobile application „Boar Forecast\" (the „App\") offered by Boarlytics, Frieder Baumann, Softwareentwicklung Wildtiermanagement (the „Provider\"). Google LLC and Apple Inc. are distribution platforms only — they are not parties to the usage contract.</p>\n<h2>§ 2 Contract Formation and Consent</h2>\n<p>The usage contract is formed when the user registers in the App and actively ticks a checkbox confirming acceptance of these Terms and the Privacy Policy. A pre-checked checkbox is not permitted.</p>\n<p>Use of the App without accepting these Terms is not possible. Minors (under 18) may not use the App. By registering, the user confirms they are 18 or older.</p>\n<h2>§ 3 Services and Licence</h2>\n<p>The Provider grants a simple, non-transferable, revocable licence to use the App on personal devices for private or commercial hunting purposes. Tiers:</p>\n<ul><li><b>Free:</b> basic forecast for up to 2 feeding stations, free, no minimum term</li>\n<li><b>Wind</b> (one-time, EUR 17.99 incl. VAT): wind display and unlimited feeding stations — one-time licence fee for use during active service operation</li>\n<li><b>PRO</b> (subscription, EUR 2.50/month incl. VAT): DeepForecast, station sharing, push notifications — cancellable monthly</li></ul>\n<p>Future paid features (wildlife camera integration, automatic feeder control) will be offered separately and are covered by these Terms once activated.</p>\n<h2>§ 4 Wind One-Time Purchase — Licence and Right of Withdrawal</h2>\n<p>The Wind purchase grants a usage licence for the Wind feature for the duration of active service operation; it is not a permanent acquisition of software.</p>\n<p>The statutory 14-day right of withdrawal lapses for digital content with immediate delivery (§ 356(5) German Civil Code) if the user expressly agrees and acknowledges the loss of the right. This is confirmed via a mandatory checkbox in the in-app purchase dialogue.</p>\n<p>After the withdrawal period lapses or the right is waived, no refund or return claim exists — including in the event of service discontinuation after the § 9 notice period.</p>\n<h2>§ 5 PRO Subscription — Term, Renewal and Cancellation</h2>\n<p>The PRO subscription is billed monthly and renews automatically unless cancelled before the end of the current billing period.</p>\n<p>Cancellation is managed exclusively through the app store platform:</p>\n<ul><li>Android: Google Play Store → Settings → Subscriptions → Boar Forecast → Cancel</li>\n<li>iOS: Settings → [Apple ID] → Subscriptions → Boar Forecast → Cancel</li></ul>\n<p>After cancellation, PRO features remain available until the end of the paid period; the account is then downgraded to Free. Shared feeding stations are frozen (readable, not editable) until sharing ends or PRO is reactivated.</p>\n<p>Partial refunds for early cancellation are excluded unless required by law.</p>\n<h2>§ 6 Prices and Payment</h2>\n<p>All prices are final prices including statutory VAT. Payment is processed via Google Play Billing or Apple In-App Purchase. The Provider has no access to payment data.</p>\n<p>The Provider may adjust prices. Increases for existing PRO subscriptions are announced at least 30 days in advance via in-app notification; the user may cancel before the new price takes effect.</p>\n<h2>§ 7 Forecasts — No Guarantee of Success</h2>\n<p>The App calculates visit probabilities using a statistical model based on historical hunting and weather data. Forecasts are probability estimates, not guarantees. The Provider accepts no liability for absent wildlife visits or decisions based on app data.</p>\n<h2>§ 8 Availability — Offline Operation and Outages</h2>\n<p>The Provider aims for high availability but gives no guarantee of uninterrupted operation. When the backend is unavailable, the App shows cached data (offline mode). New forecasts are not possible then.</p>\n<p>The user has no entitlement to:</p>\n<ul><li>Uninterrupted availability of backend or forecast function</li>\n<li>Refund of subscription fees due to technical outages, unless caused by gross negligence or intent</li>\n<li>Damages for data loss due to connectivity, device failure or force majeure</li></ul>\n<h2>§ 9 Service Discontinuation</h2>\n<p>The Provider may discontinue the service at any time. On permanent discontinuation:</p>\n<ul><li>Notice: at least 30 days via in-app notification and email</li>\n<li>Data export: offered before discontinuation</li>\n<li>Refunds: none for the Wind purchase after the withdrawal period; PRO refunded pro-rata for the unused period</li>\n<li>No further damages due to discontinuation</li></ul>\n<h2>§ 10 User Obligations</h2>\n<p>The user agrees to enter hunting data accurately, keep credentials secure, not share or transfer the account, not run automated API queries, and not use the App unlawfully. The Provider may suspend or delete accounts for serious or repeated violations.</p>\n<h2>§ 11 Privacy</h2>\n<p>Personal data is processed per the separate Privacy Policy at <a href=\"https://boarlytics.com/privacy\">boarlytics.com/privacy</a>, which forms part of these Terms.</p>\n<h2>§ 12 Amendments</h2>\n<p>The Provider may amend these Terms with at least 30 days' notice via in-app notification. On next use after the notice period, the user is asked to accept the new version; no objection or active acceptance means the amended Terms are accepted. On objection, the Provider may terminate at the end of the notice period; PRO subscriptions refunded pro-rata.</p>\n<h2>§ 13 Limitation of Liability</h2>\n<p>Liability is limited to intent and gross negligence, except for injury to life, body or health, or breach of cardinal duties. For breach of cardinal duties without intent or gross negligence, liability is limited to typical foreseeable damage. Product Liability Act unaffected.</p>\n<h2>§ 14 Governing Law, Jurisdiction and Dispute Resolution</h2>\n<p>German law applies, excluding the CISG. Jurisdiction for merchants: Kaiserslautern, Germany. For consumers, statutory jurisdiction applies. EU ODR platform: <a href=\"https://ec.europa.eu/consumers/odr\">ec.europa.eu/consumers/odr</a>. The Provider is not obliged/willing to participate in consumer arbitration unless required by law.</p>\n<h2>§ 15 Severability</h2>\n<p>If any provision is or becomes invalid, the remaining provisions stay valid; the invalid one is replaced by a valid provision closest to its economic purpose.</p>", "fr": "<h1>Conditions Générales d'Utilisation (CGU)</h1>\n<div class=\"meta\">Boarlytics · Frieder Baumann · Mai 2026 · Version 1.0</div>\n<h2>§ 1 Champ d'application et parties</h2>\n<p>Les présentes CGU régissent l'utilisation de l'application mobile « Boar Forecast » (l'« Application ») proposée par Boarlytics, Frieder Baumann, Softwareentwicklung Wildtiermanagement (le « Prestataire »). Google LLC et Apple Inc. sont des plateformes de distribution et non des parties au contrat.</p>\n<h2>§ 2 Conclusion du contrat et consentement</h2>\n<p>Le contrat est conclu lorsque l'utilisateur s'inscrit et coche activement une case confirmant l'acceptation des présentes CGU et de la Politique de Confidentialité. Une case précochée n'est pas autorisée.</p>\n<p>L'utilisation sans acceptation est impossible. Les mineurs (moins de 18 ans) ne sont pas autorisés à utiliser l'Application.</p>\n<h2>§ 3 Description des services et licence</h2>\n<p>Le Prestataire accorde une licence simple, non transférable et révocable pour un usage cynégétique privé ou professionnel. Niveaux :</p>\n<ul><li><b>Gratuit :</b> prévisions de base pour 2 affûts maximum, sans engagement</li>\n<li><b>Wind</b> (achat unique, 17,99 EUR TTC) : affichage du vent et affûts illimités — licence unique pendant la durée du service actif</li>\n<li><b>PRO</b> (abonnement, 2,50 EUR/mois TTC) : DeepForecast, partage d'affût, notifications push — résiliable mensuellement</li></ul>\n<p>Les futures fonctionnalités payantes (caméra animalière, distributeur automatique) seront proposées séparément et couvertes dès activation.</p>\n<h2>§ 4 Achat unique « Wind » — Licence et droit de rétractation</h2>\n<p>L'achat Wind confère une licence d'utilisation pendant la durée du service actif ; ce n'est pas une acquisition permanente d'un logiciel.</p>\n<p>Le droit de rétractation de 14 jours s'éteint pour les contenus numériques à fourniture immédiate (§ 356 al. 5 du Code civil allemand) si l'utilisateur y consent expressément et reconnaît la perte de ce droit, via une case obligatoire dans le dialogue d'achat.</p>\n<p>Après expiration ou renonciation, aucun remboursement n'est dû, y compris en cas d'arrêt du service après le préavis du § 9.</p>\n<h2>§ 5 Abonnement PRO — Durée, renouvellement et résiliation</h2>\n<p>L'abonnement PRO est facturé mensuellement et se renouvelle automatiquement sauf résiliation avant la fin de la période en cours.</p>\n<p>La résiliation s'effectue exclusivement via la plateforme :</p>\n<ul><li>Android : Google Play Store → Paramètres → Abonnements → Boar Forecast → Résilier</li>\n<li>iOS : Réglages → [Identifiant Apple] → Abonnements → Boar Forecast → Résilier</li></ul>\n<p>Après résiliation, les fonctions PRO restent disponibles jusqu'à la fin de la période payée ; le compte est rétrogradé au niveau Gratuit. Les affûts partagés sont figés (lisibles, non modifiables) jusqu'à la fin du partage ou la réactivation du PRO.</p>\n<p>Les remboursements partiels en cas de résiliation anticipée sont exclus, sauf obligation légale.</p>\n<h2>§ 6 Prix et conditions de paiement</h2>\n<p>Tous les prix sont des prix finaux TTC. Paiement via Google Play Billing ou Apple In-App Purchase. Le Prestataire n'a pas accès aux données de paiement.</p>\n<p>Le Prestataire peut ajuster les prix. Les hausses pour les abonnements PRO existants sont annoncées au moins 30 jours à l'avance ; l'utilisateur peut résilier avant l'entrée en vigueur.</p>\n<h2>§ 7 Prévisions — Aucune garantie de résultat</h2>\n<p>L'Application calcule des probabilités de visite via un modèle statistique basé sur des données historiques de chasse et de météo. Ce sont des estimations, pas des garanties. Le Prestataire n'est pas responsable des visites absentes ni des décisions prises sur cette base.</p>\n<h2>§ 8 Disponibilité — Mode hors ligne et pannes</h2>\n<p>Le Prestataire vise une haute disponibilité sans garantir un fonctionnement ininterrompu. En cas d'indisponibilité, l'Application affiche les dernières données en cache (mode hors ligne).</p>\n<p>L'utilisateur n'a pas droit à :</p>\n<ul><li>Une disponibilité ininterrompue du backend ou de la prévision</li>\n<li>Un remboursement en cas de panne technique, sauf faute lourde ou intentionnelle</li>\n<li>Des dommages-intérêts pour perte de données (connexion, appareil, force majeure)</li></ul>\n<h2>§ 9 Arrêt du service</h2>\n<p>Le Prestataire peut arrêter le service à tout moment. En cas d'arrêt définitif :</p>\n<ul><li>Préavis : au moins 30 jours via notification in-app et e-mail</li>\n<li>Export de données proposé avant l'arrêt</li>\n<li>Remboursements : aucun pour Wind après le délai de rétractation ; PRO remboursé au prorata</li>\n<li>Aucun autre dommages-intérêts</li></ul>\n<h2>§ 10 Obligations de l'utilisateur</h2>\n<p>L'utilisateur s'engage à saisir des données exactes, protéger ses identifiants, ne pas partager/transférer son compte, ne pas effectuer de requêtes automatisées, ni utiliser l'Application à des fins illicites. Le Prestataire peut suspendre ou supprimer les comptes en cas de violations graves ou répétées.</p>\n<h2>§ 11 Protection des données</h2>\n<p>Les données sont traitées conformément à la Politique de Confidentialité distincte à l'adresse <a href=\"https://boarlytics.com/confidentialite\">boarlytics.com/confidentialite</a>, qui fait partie intégrante des présentes C
