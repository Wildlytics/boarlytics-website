<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confidentialité – Boarlytics</title>
<style>
:root{--bg:#0a0b0a;--line:#2a2d2a;--hair:rgba(255,255,255,.07);--lime:#93d13f;--text:#f4f5f2;--muted2:#6c726c;
--sans:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,system-ui,sans-serif;--mono:"Cascadia Code",Consolas,ui-monospace,monospace;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.65;font-size:16px;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:10;background:rgba(10,11,10,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--hair)}
.head{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 22px}
.brand img{height:32px}
.langs{display:flex;gap:4px}
.langs button{background:none;border:1px solid var(--line);color:var(--muted2);font-family:var(--mono);font-size:.72rem;padding:5px 9px;border-radius:6px;cursor:pointer}
.langs button.active{background:var(--lime);color:#0a0b0a;font-weight:700;border-color:var(--lime)}
main{max-width:820px;margin:0 auto;padding:44px 22px 60px}
.legal h1{font-size:2rem;font-weight:800;margin-bottom:4px}
.legal h2{font-size:1.15rem;font-weight:800;color:var(--lime);margin:26px 0 8px;border-top:1px solid var(--line);padding-top:20px}
.legal h2:first-of-type{border-top:none;padding-top:0}
.legal .meta{font-family:var(--mono);font-size:.78rem;color:var(--muted2);margin-bottom:18px}
.legal p{margin:8px 0;color:#d5d9d3} .legal ul{margin:8px 0 8px 22px;color:#d5d9d3} .legal li{margin:5px 0}
.legal a{color:var(--lime)}
footer{border-top:1px solid var(--hair);margin-top:40px}
.foot{max-width:820px;margin:0 auto;padding:26px 22px;display:flex;gap:18px;flex-wrap:wrap;font-size:.88rem}
.foot a{color:#b7bcb6;text-decoration:none} .foot a:hover{color:#fff}
</style>
</head>
<body>
<header><div class="head">
  <a href="/"><img class="brand" src="/boarlytics-logo.png" alt="Boarlytics" style="height:32px"></a>
  <div class="langs">
    <button data-l="de" onclick="setLang('de')">DE</button>
    <button data-l="en" onclick="setLang('en')">EN</button>
    <button data-l="fr" onclick="setLang('fr')">FR</button>
  </div>
</div></header>
<main><div class="legal" id="content"></div></main>
<footer><div class="foot" id="foot"></div></footer>
<script>
const DOC={"de": "<h1>Datenschutzerklärung</h1><div class=\"meta\">Boar Forecast App · Boarlytics · Stand: Mai 2026</div>\n<h2>1. Verantwortlicher</h2><p>Boarlytics, Frieder Baumann, c/o flexdienst – #20469, Kurt-Schumacher-Straße 76, 67663 Kaiserslautern. E-Mail: <a href=\"mailto:info@boarlytics.com\">info@boarlytics.com</a></p>\n<h2>2. Verarbeitete Daten</h2><ul>\n<li>Konto-/Registrierungsdaten (E-Mail) – Art. 6 Abs. 1 lit. b DSGVO</li>\n<li>Einwilligungsnachweis (Zeitstempel + Version, keine IP-Adresse)</li>\n<li>Jagd-/Reviersdaten, Kirrungen, Besuche, Prognosen</li>\n<li>Standortdaten – nur bei aktiver Nutzung des Karten-Pickers, nicht im Hintergrund</li>\n<li>Push-Token (nur PRO, bei aktivierten Benachrichtigungen)</li></ul>\n<h2>3. Auftragsverarbeiter / Dienste</h2><p>Firebase / Google (Authentifizierung, Firestore, ggf. Cloud Messaging); Google Play Billing bzw. Apple In-App Purchase für Zahlungen (kein Zugriff auf Zahlungsdaten durch den Anbieter).</p>\n<h2>4. Speicherdauer</h2><p>Daten werden gespeichert, solange das Konto besteht, und nach Kontolöschung entfernt.</p>\n<h2>5. Ihre Rechte</h2><p>Auskunft, Berichtigung, Löschung (Art. 17 DSGVO – Kontolöschung direkt in der App), Einschränkung, Datenübertragbarkeit, Widerspruch sowie Beschwerderecht bei einer Aufsichtsbehörde.</p>\n<h2>6. Kamera / KI-Trainingsdaten (zukünftig)</h2><p>Bei künftiger Aktivierung der Wildkamera-Funktion werden anonymisierte Bildausschnitte nur mit gesonderter Einwilligung (Art. 6 Abs. 1 lit. a DSGVO) zum Modelltraining verwendet; der GPS-Standort wird nie einbezogen.</p>", "en": "<h1>Privacy Policy</h1><div class=\"meta\">Boar Forecast App · Boarlytics · May 2026</div>\n<h2>1. Controller</h2><p>Boarlytics, Frieder Baumann, c/o flexdienst – #20469, Kurt-Schumacher-Straße 76, 67663 Kaiserslautern, Germany. Email: <a href=\"mailto:info@boarlytics.com\">info@boarlytics.com</a></p>\n<h2>2. Data Processed</h2><ul>\n<li>Account / registration data (email) – Art. 6(1)(b) GDPR</li>\n<li>Consent record (timestamp + version, no IP address)</li>\n<li>Hunting / territory data, feeding stations, visits, forecasts</li>\n<li>Location – only when actively using the map picker, never in the background</li>\n<li>Push token (PRO only, when notifications enabled)</li></ul>\n<h2>3. Processors / Services</h2><p>Firebase / Google (authentication, Firestore, optionally Cloud Messaging); Google Play Billing or Apple In-App Purchase for payments (no access to payment data by the Provider).</p>\n<h2>4. Retention</h2><p>Data is stored while the account exists and removed upon account deletion.</p>\n<h2>5. Your Rights</h2><p>Access, rectification, erasure (Art. 17 GDPR – account deletion available in the app), restriction, portability, objection, and the right to lodge a complaint with a supervisory authority.</p>\n<h2>6. Camera / AI Training Data (future)</h2><p>When the wildlife camera feature is later enabled, anonymised image crops are used for model training only with separate consent (Art. 6(1)(a) GDPR); GPS location is never included.</p>", "fr": "<h1>Politique de Confidentialité</h1><div class=\"meta\">Boar Forecast App · Boarlytics · Mai 2026</div>\n<h2>1. Responsable du traitement</h2><p>Boarlytics, Frieder Baumann, c/o flexdienst – #20469, Kurt-Schumacher-Straße 76, 67663 Kaiserslautern, Allemagne. E-mail : <a href=\"mailto:info@boarlytics.com\">info@boarlytics.com</a></p>\n<h2>2. Données traitées</h2><ul>\n<li>Données de compte / inscription (e-mail) – art. 6(1)(b) RGPD</li>\n<li>Preuve de consentement (horodatage + version, sans adresse IP)</li>\n<li>Données de chasse / territoires, affûts, visites, prévisions</li>\n<li>Localisation – uniquement lors de l'usage actif du sélecteur de carte, jamais en arrière-plan</li>\n<li>Jeton push (PRO uniquement, si notifications activées)</li></ul>\n<h2>3. Sous-traitants / services</h2><p>Firebase / Google (authentification, Firestore, éventuellement Cloud Messaging) ; Google Play Billing ou Apple In-App Purchase pour les paiements (aucun accès aux données de paiement par le Prestataire).</p>\n<h2>4. Durée de conservation</h2><p>Les données sont conservées tant que le compte existe et supprimées lors de sa suppression.</p>\n<h2>5. Vos droits</h2><p>Accès, rectification, effacement (art. 17 RGPD – suppression du compte dans l'application), limitation, portabilité, opposition, et droit de réclamation auprès d'une autorité de contrôle.</p>\n<h2>6. Caméra / données d'entraînement IA (à venir)</h2><p>Lors de l'activation future de la caméra animalière, des extraits d'images anonymisés ne sont utilisés pour l'entraînement qu'avec un consentement distinct (art. 6(1)(a) RGPD) ; la position GPS n'est jamais incluse.</p>"};
const LAB={"de": {"back": "Zur Startseite", "agb": "AGB", "ds": "Datenschutz", "imp": "Impressum"}, "en": {"back": "Home", "agb": "Terms", "ds": "Privacy", "imp": "Legal Notice"}, "fr": {"back": "Accueil", "agb": "CGU", "ds": "Confidentialité", "imp": "Mentions légales"}};
let lang="fr";
function render(){
  document.getElementById('content').innerHTML=DOC[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('active',b.dataset.l===lang));
  const L=LAB[lang];
  document.getElementById('foot').innerHTML='<a href="/">← '+L.back+'</a><a href="/agb">'+L.agb+'</a><a href="/datenschutz">'+L.ds+'</a><a href="/imprint">'+L.imp+'</a>';
}
function setLang(l){lang=l;render();}
render();
</script>
</body>
</html>
