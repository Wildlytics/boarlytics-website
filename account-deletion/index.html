<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konto &amp; Daten löschen – Boarlytics</title>
<style>
:root{--bg:#0a0b0a;--line:#2a2d2a;--hair:rgba(255,255,255,.07);--lime:#93d13f;--text:#f4f5f2;--muted2:#6c726c;
--sans:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,system-ui,sans-serif;--mono:"Cascadia Code",Consolas,ui-monospace,monospace;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.65;font-size:16px;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:10;background:rgba(10,11,10,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--hair)}
.head{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 22px}
.brand img{height:56px}
.langs{display:flex;gap:4px}
.langs button{background:none;border:1px solid var(--line);color:var(--muted2);font-family:var(--mono);font-size:.72rem;padding:5px 9px;border-radius:6px;cursor:pointer}
.langs button.active{background:var(--lime);color:#0a0b0a;font-weight:700;border-color:var(--lime)}
main{max-width:820px;margin:0 auto;padding:44px 22px 60px}
.legal h1{font-size:2rem;font-weight:800;margin-bottom:4px}
.legal h2{font-size:1.15rem;font-weight:800;color:var(--lime);margin:26px 0 8px;border-top:1px solid var(--line);padding-top:20px}
.legal h2:first-of-type{border-top:none;padding-top:0}
.legal .meta{font-family:var(--mono);font-size:.78rem;color:var(--muted2);margin-bottom:18px}
.legal p{margin:8px 0;color:#d5d9d3} .legal ul{margin:8px 0 8px 22px;color:#d5d9d3} .legal li{margin:5px 0}
.legal a{color:var(--lime)}
footer{border-top:1px solid var(--hair);margin-top:40px}
.foot{max-width:820px;margin:0 auto;padding:26px 22px;display:flex;gap:18px;flex-wrap:wrap;font-size:.88rem}
.foot a{color:#b7bcb6;text-decoration:none} .foot a:hover{color:#fff}
</style></head>
<body>
<header><div class="head">
  <a href="/"><img class="brand" src="/boarlytics-logo.png" alt="Boarlytics" style="height:56px"></a>
  <div class="langs">
    <button data-l="de" onclick="setLang('de')">DE</button>
    <button data-l="en" onclick="setLang('en')">EN</button>
    <button data-l="fr" onclick="setLang('fr')">FR</button>
  </div>
</div></header>
<main><div class="legal" id="content"></div></main>
<footer><div class="foot" id="foot"></div></footer>
<script>
const DOC={"de": "<h1>Konto &amp; Daten löschen</h1><div class=\"meta\">Boar Forecast · Boarlytics</div>\n<p>Hier erfährst du, wie du dein Konto, einzelne Kirrungen oder alle deine Daten in der App Boar Forecast löschst – und wie du deine Daten exportierst.</p>\n<h2>Konto vollständig löschen</h2>\n<p>Du kannst dein Konto und alle zugehörigen Daten jederzeit selbst löschen:</p>\n<ul>\n<li><b>In der App:</b> Einstellungen → Konto löschen. Nach einer Sicherheitsabfrage wird die Löschung ausgelöst.</li>\n<li><b>Per E-Mail:</b> Schreibe an <a href=\"mailto:info@boarlytics.com\">info@boarlytics.com</a>. Wir löschen dein Konto nach Bestätigung deiner Identität.</li>\n</ul>\n<p>Gelöscht werden: dein Nutzerkonto, alle Reviere und Kirrungen, alle Besuche und Bestückungen, gespeicherte Standorte sowie die daraus berechneten Prognosen. Die Löschung erfolgt vollständig und unwiderruflich innerhalb von 30 Tagen. Eine bloße Deaktivierung (Einfrieren) findet nicht statt.</p>\n<h2>Einzelne Kirrung löschen</h2>\n<p>Möchtest du nur eine einzelne Kirrung entfernen, musst du nicht dein ganzes Konto löschen: Öffne in der <b>Übersicht</b> die betreffende Kirrung und wähle im Menü <b>Löschen</b>. Die Kirrung wird mit ihren Besuchen und Prognosen entfernt. Einzelne Besuchseinträge kannst du auf die gleiche Weise löschen.</p>\n<h2>Daten exportieren (CSV)</h2>\n<p>Über <b>Einstellungen → Daten exportieren</b> erhältst du deine Reviere, Kirrungen und Besuchseinträge als CSV-Datei. Diese lässt sich in gängigen Programmen (z. B. Tabellenkalkulation) öffnen und dient sowohl deiner eigenen Auswertung als auch deinem Recht auf Datenübertragbarkeit (Art. 20 DSGVO).</p>\n<h2>Fragen?</h2>\n<p>Bei Fragen zur Löschung oder zum Export erreichst du uns unter <a href=\"mailto:info@boarlytics.com\">info@boarlytics.com</a>.</p>", "en": "<h1>Delete account &amp; data</h1><div class=\"meta\">Boar Forecast · Boarlytics</div>\n<p>Here you learn how to delete your account, individual feeding stations or all of your data in the Boar Forecast app – and how to export your data.</p>\n<h2>Delete your entire account</h2>\n<p>You can delete your account and all associated data at any time:</p>\n<ul>\n<li><b>In the app:</b> Settings → Delete account. After a confirmation prompt, deletion is triggered.</li>\n<li><b>By email:</b> write to <a href=\"mailto:info@boarlytics.com\">info@boarlytics.com</a>. We delete your account after confirming your identity.</li>\n</ul>\n<p>The following are deleted: your user account, all territories and feeding stations, all visits and baiting, stored locations and the forecasts derived from them. Deletion is complete and irreversible within 30 days. Mere deactivation (freezing) does not take place.</p>\n<h2>Delete a single feeding station</h2>\n<p>To remove just one feeding station, you don't need to delete your whole account: open the station in the <b>Overview</b> and choose <b>Delete</b> from the menu. The station is removed together with its visits and forecasts. Individual visit entries can be deleted the same way.</p>\n<h2>Export your data (CSV)</h2>\n<p>Under <b>Settings → Export data</b> you receive your territories, feeding stations and visit entries as a CSV file. It opens in common programs (e.g. a spreadsheet) and serves both your own analysis and your right to data portability (Art. 20 GDPR).</p>\n<h2>Questions?</h2>\n<p>For any questions about deletion or export, contact us at <a href=\"mailto:info@boarlytics.com\">info@boarlytics.com</a>.</p>", "fr": "<h1>Supprimer le compte &amp; les données</h1><div class=\"meta\">Boar Forecast · Boarlytics</div>\n<p>Vous apprenez ici comment supprimer votre compte, des agrainages individuels ou toutes vos données dans l'application Boar Forecast – et comment exporter vos données.</p>\n<h2>Supprimer entièrement le compte</h2>\n<p>Vous pouvez supprimer votre compte et toutes les données associées à tout moment :</p>\n<ul>\n<li><b>Dans l'application :</b> Réglages → Supprimer le compte. Après une confirmation, la suppression est déclenchée.</li>\n<li><b>Par e-mail :</b> écrivez à <a href=\"mailto:info@boarlytics.com\">info@boarlytics.com</a>. Nous supprimons votre compte après vérification de votre identité.</li>\n</ul>\n<p>Sont supprimés : votre compte, tous les territoires et agrainages, toutes les visites et agrainages, les positions enregistrées et les prévisions dérivées. La suppression est complète et irréversible sous 30 jours. Aucune simple désactivation (gel) n'a lieu.</p>\n<h2>Supprimer un agrainage</h2>\n<p>Pour retirer un seul agrainage, pas besoin de supprimer tout le compte : ouvrez l'agrainage dans l'<b>Aperçu</b> et choisissez <b>Supprimer</b> dans le menu. L'agrainage est retiré avec ses visites et prévisions. Les entrées de visite individuelles se suppriment de la même façon.</p>\n<h2>Exporter vos données (CSV)</h2>\n<p>Sous <b>Réglages → Exporter les données</b>, vous obtenez vos territoires, agrainages et entrées de visite au format CSV. Il s'ouvre dans les programmes courants (par ex. un tableur) et sert à votre analyse ainsi qu'à votre droit à la portabilité (art. 20 RGPD).</p>\n<h2>Des questions ?</h2>\n<p>Pour toute question sur la suppression ou l'export, contactez-nous à <a href=\"mailto:info@boarlytics.com\">info@boarlytics.com</a>.</p>"};
const LAB={"de": {"back": "Zur Startseite", "agb": "AGB", "ds": "Datenschutz", "imp": "Impressum"}, "en": {"back": "Home", "agb": "Terms", "ds": "Privacy", "imp": "Legal Notice"}, "fr": {"back": "Accueil", "agb": "CGU", "ds": "Confidentialité", "imp": "Mentions légales"}};
function detect(){try{var s=localStorage.getItem("bl_lang");if(s&&["de","en","fr"].includes(s))return s;}catch(e){}var L=navigator.languages||[navigator.language||"de"];for(var i=0;i<L.length;i++){var c=(L[i]||"").slice(0,2).toLowerCase();if(["de","en","fr"].includes(c))return c;}return "en";}
let lang=detect();
function render(){
  document.getElementById('content').innerHTML=DOC[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('active',b.dataset.l===lang));
  const L=LAB[lang];
  document.getElementById('foot').innerHTML='<a href="/">← '+L.back+'</a><a href="/agb">'+L.agb+'</a><a href="/datenschutz">'+L.ds+'</a><a href="/imprint">'+L.imp+'</a>';
}
function setLang(l){lang=l;try{localStorage.setItem("bl_lang",l)}catch(e){}render();}
render();
</script>
</body></html>
