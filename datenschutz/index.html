<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datenschutz – Boarlytics</title>
<style>
:root{--bg:#0a0b0a;--line:#2a2d2a;--hair:rgba(255,255,255,.07);--lime:#93d13f;--text:#f4f5f2;--muted2:#6c726c;
--sans:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,system-ui,sans-serif;--mono:"Cascadia Code",Consolas,ui-monospace,monospace;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.65;font-size:16px;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:10;background:rgba(10,11,10,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--hair)}
.head{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 22px}
.brand img{height:56px}
.langs{display:flex;gap:4px}
.langs button{background:none;border:1px solid var(--line);color:var(--muted2);font-family:var(--mono);font-size:.72rem;padding:5px 9px;border-radius:6px;cursor:pointer}
.langs button.active{background:var(--lime);color:#0a0b0a;font-weight:700;border-color:var(--lime)}
main{max-width:820px;margin:0 auto;padding:44px 22px 60px}
.legal h1{font-size:2rem;font-weight:800;margin-bottom:4px}
.legal h2{font-size:1.15rem;font-weight:800;color:var(--lime);margin:26px 0 8px;border-top:1px solid var(--line);padding-top:20px}
.legal h2:first-of-type{border-top:none;padding-top:0}
.legal .meta{font-family:var(--mono);font-size:.78rem;color:var(--muted2);margin-bottom:18px}
.legal p{margin:8px 0;color:#d5d9d3} .legal ul{margin:8px 0 8px 22px;color:#d5d9d3} .legal li{margin:5px 0}
.legal a{color:var(--lime)}
footer{border-top:1px solid var(--hair);margin-top:40px}
.foot{max-width:820px;margin:0 auto;padding:26px 22px;display:flex;gap:18px;flex-wrap:wrap;font-size:.88rem}
.foot a{color:#b7bcb6;text-decoration:none} .foot a:hover{color:#fff}
</style></head>
<body>
<header><div class="head">
  <a href="/"><img class="brand" src="/boarlytics-logo.png" alt="Boarlytics" style="height:56px"></a>
  <div class="langs">
    <button data-l="de" onclick="setLang('de')">DE</button>
    <button data-l="en" onclick="setLang('en')">EN</button>
    <button data-l="fr" onclick="setLang('fr')">FR</button>
  </div>
</div></header>
<main><div class="legal" id="content"></div></main>
<footer><div class="foot" id="foot"></div></footer>
<script>
const DOC={"de": "<h1>Datenschutzerklärung</h1>\n<div class=\"meta\">Boar Forecast App · Boarlytics · Stand: August 2026</div>\n<p>Der Schutz deiner Daten ist uns wichtig. Diese Erklärung informiert dich darüber, welche personenbezogenen Daten wir bei der Nutzung der App „Boar Forecast\" verarbeiten, zu welchem Zweck und auf welcher Rechtsgrundlage.</p>\n\n<h2>1. Verantwortlicher</h2>\n<p>Boarlytics, Frieder Baumann – Softwareentwicklung Wildtiermanagement<br>c/o flexdienst – #20469, Kurt-Schumacher-Straße 76, 67663 Kaiserslautern, Deutschland<br>E-Mail: <a href=\"mailto:info@boarlytics.com\">info@boarlytics.com</a></p>\n\n<h2>2. Grundsätze</h2>\n<p>Wir verarbeiten nur die Daten, die für den Betrieb der App erforderlich sind. Wir verkaufen keine Daten und schalten keine Werbung. Deine Jagddaten bleiben bei dir.</p>\n\n<h2>3. Welche Daten wir verarbeiten</h2>\n<ul>\n<li><b>Kontodaten:</b> E-Mail-Adresse und ein verschlüsseltes Passwort zur Anmeldung.</li>\n<li><b>Einwilligungsnachweis:</b> Zeitstempel und Version der akzeptierten Bedingungen (ohne IP-Adresse).</li>\n<li><b>Jagd- und Reviersdaten:</b> von dir angelegte Reviere und Kirrungen, erfasste Besuche und Bestückungen, daraus berechnete Prognosen.</li>\n<li><b>Standortdaten:</b> die Koordinaten deiner Kirrungen und Reviere – erfasst ausschließlich, wenn du einen Standort aktiv auf der Karte setzt, nicht im Hintergrund.</li>\n<li><b>Wetterbezug:</b> zu deinen Kirrungen rufen wir standortbezogene Wetterdaten ab (u. a. Windrichtung, Temperatur, Niederschlag, Mondphase).</li>\n<li><b>Push-Token:</b> nur, wenn du Benachrichtigungen aktivierst.</li>\n<li><b>Technische Diagnosedaten:</b> im Fehlerfall anonymisierte Absturz- und Fehlerberichte zur Stabilitätsverbesserung.</li>\n</ul>\n\n<h2>4. Zwecke und Rechtsgrundlagen</h2>\n<p>Wir verarbeiten deine Daten, um die App bereitzustellen und die Besuchsprognose zu berechnen (Vertragserfüllung, Art. 6 Abs. 1 lit. b DSGVO). Fehlerdiagnose und Betriebssicherheit stützen wir auf unser berechtigtes Interesse an einem stabilen Dienst (Art. 6 Abs. 1 lit. f DSGVO). Optionale Funktionen wie Push-Benachrichtigungen erfolgen auf Grundlage deiner Einwilligung (Art. 6 Abs. 1 lit. a DSGVO), die du jederzeit widerrufen kannst.</p>\n\n<h2>5. Hosting und Auftragsverarbeiter</h2>\n<p>Zur Bereitstellung setzen wir sorgfältig ausgewählte Dienstleister als Auftragsverarbeiter ein:</p>\n<ul>\n<li><b>Google Firebase</b> (Google Ireland Ltd.) für Authentifizierung, Datenbank (Firestore) und ggf. Push-Nachrichten. Die Daten werden in einem Rechenzentrum in der EU (Frankfurt) gespeichert.</li>\n<li><b>Fehler-Monitoring</b> zur Erfassung anonymisierter Absturzberichte.</li>\n<li><b>Wetterdatendienst</b> zum Abruf standortbezogener Wetterinformationen.</li>\n<li><b>Google Play bzw. Apple App Store</b> für die Zahlungsabwicklung bei Käufen.</li>\n</ul>\n<p>Mit diesen Dienstleistern bestehen – soweit erforderlich – Verträge zur Auftragsverarbeitung (Art. 28 DSGVO). Soweit dabei eine Übermittlung in Drittländer erfolgt, ist diese durch geeignete Garantien (u. a. EU-Standardvertragsklauseln) abgesichert.</p>\n\n<h2>6. Zahlungen</h2>\n<p>Käufe (z. B. die einmalige Wind-Freischaltung) werden über Google Play Billing bzw. Apple In-App Purchase abgewickelt. Wir erhalten keine vollständigen Zahlungsdaten, sondern lediglich die Information, ob ein Kauf erfolgreich war.</p>\n\n<h2>7. Speicherdauer</h2>\n<p>Wir speichern deine Daten, solange dein Konto besteht. Nach einer Löschung werden Konto und zugehörige Daten innerhalb von 30 Tagen vollständig entfernt, sofern keine gesetzlichen Aufbewahrungspflichten entgegenstehen.</p>\n\n<h2>8. Deine Rechte</h2>\n<p>Dir stehen die Rechte auf Auskunft (Art. 15), Berichtigung (Art. 16), Löschung (Art. 17), Einschränkung der Verarbeitung (Art. 18), Datenübertragbarkeit (Art. 20) sowie Widerspruch (Art. 21 DSGVO) zu. Erteilte Einwilligungen kannst du jederzeit mit Wirkung für die Zukunft widerrufen.</p>\n\n<h2 id=\"konto-loeschen\">9. Konto und Daten löschen</h2>\n<p>Du kannst dein Konto und alle zugehörigen Daten jederzeit selbst löschen:</p>\n<ul>\n<li><b>In der App:</b> <b>Einstellungen → Konto löschen</b>. Nach einer Sicherheitsabfrage wird die Löschung ausgelöst.</li>\n<li><b>Per E-Mail:</b> Anfrage an <a href=\"mailto:info@boarlytics.com\">info@boarlytics.com</a>.</li>\n</ul>\n<p>Gelöscht werden dein Nutzerkonto sowie alle gespeicherten Inhalte: Reviere, Kirrungen, Besuche, Bestückungen, Standorte und daraus berechnete Prognosen. Die Löschung erfolgt vollständig und unwiderruflich innerhalb von 30 Tagen. Eine bloße Deaktivierung (Einfrieren) findet nicht statt.</p>\n\n<h2>10. Einzelne Kirrung löschen</h2>\n<p>Du musst nicht dein ganzes Konto löschen, um einzelne Einträge zu entfernen. In der App kannst du eine einzelne Kirrung samt ihren Besuchen und Prognosen löschen: In der <b>Übersicht</b> die betreffende Kirrung öffnen und über das Menü <b>Löschen</b> wählen. Ebenso lassen sich einzelne Besuchseinträge entfernen. Gelöschte Kirrungen und Einträge werden aus deinem Datenbestand entfernt.</p>\n\n<h2>11. Datenexport (CSV)</h2>\n<p>Du kannst deine erfassten Daten selbst exportieren. Über <b>Einstellungen → Daten exportieren</b> erhältst du deine Reviere, Kirrungen und Besuchseinträge als CSV-Datei. Das Format ist in gängigen Programmen (z. B. Tabellenkalkulation) lesbar und dient sowohl deiner eigenen Auswertung als auch der Wahrnehmung deines Rechts auf Datenübertragbarkeit (Art. 20 DSGVO).</p>\n\n<h2>12. Beschwerderecht</h2>\n<p>Du hast das Recht, dich bei einer Datenschutz-Aufsichtsbehörde zu beschweren, insbesondere in dem EU-Mitgliedstaat deines Aufenthaltsorts oder mutmaßlichen Verstoßes.</p>\n\n<h2>13. Änderungen dieser Erklärung</h2>\n<p>Wir passen diese Datenschutzerklärung an, wenn sich die Rechtslage oder unsere Verarbeitung ändert. Die jeweils aktuelle Fassung ist in der App und unter boarlytics.com/datenschutz abrufbar.</p>", "en": "<h1>Privacy Policy</h1>\n<div class=\"meta\">Boar Forecast App · Boarlytics · August 2026</div>\n<p>Protecting your data matters to us. This policy explains which personal data we process when you use the „Boar Forecast\" app, for what purpose and on what legal basis.</p>\n\n<h2>1. Controller</h2>\n<p>Boarlytics, Frieder Baumann – Wildlife Management Software<br>c/o flexdienst – #20469, Kurt-Schumacher-Straße 76, 67663 Kaiserslautern, Germany<br>Email: <a href=\"mailto:info@boarlytics.com\">info@boarlytics.com</a></p>\n\n<h2>2. Principles</h2>\n<p>We only process the data required to run the app. We do not sell data and we do not show ads. Your hunting data stays yours.</p>\n\n<h2>3. Data we process</h2>\n<ul>\n<li><b>Account data:</b> email address and an encrypted password for sign-in.</li>\n<li><b>Consent record:</b> timestamp and version of the accepted terms (without IP address).</li>\n<li><b>Hunting and territory data:</b> the territories and feeding stations you create, logged visits and baiting, and the forecasts calculated from them.</li>\n<li><b>Location data:</b> the coordinates of your feeding stations and territories – captured only when you actively set a location on the map, never in the background.</li>\n<li><b>Weather:</b> for your feeding stations we retrieve location-based weather data (wind direction, temperature, precipitation, moon phase).</li>\n<li><b>Push token:</b> only if you enable notifications.</li>\n<li><b>Technical diagnostics:</b> anonymised crash and error reports to improve stability.</li>\n</ul>\n\n<h2>4. Purposes and legal bases</h2>\n<p>We process your data to provide the app and calculate the visit forecast (performance of a contract, Art. 6(1)(b) GDPR). Error diagnostics and operational security rely on our legitimate interest in a stable service (Art. 6(1)(f) GDPR). Optional features such as push notifications are based on your consent (Art. 6(1)(a) GDPR), which you can withdraw at any time.</p>\n\n<h2>5. Hosting and processors</h2>\n<p>We use carefully selected providers as processors:</p>\n<ul>\n<li><b>Google Firebase</b> (Google Ireland Ltd.) for authentication, database (Firestore) and, where applicable, push messages. Data is stored in an EU data centre (Frankfurt).</li>\n<li><b>Error monitoring</b> for anonymised crash reports.</li>\n<li><b>Weather data service</b> to retrieve location-based weather.</li>\n<li><b>Google Play / Apple App Store</b> for payment processing on purchases.</li>\n</ul>\n<p>Where required, data processing agreements (Art. 28 GDPR) are in place. Any transfer to third countries is safeguarded by appropriate measures (including EU Standard Contractual Clauses).</p>\n\n<h2>6. Payments</h2>\n<p>Purchases (e.g. the one-time Wind unlock) are handled via Google Play Billing or Apple In-App Purchase. We do not receive full payment data, only whether a purchase succeeded.</p>\n\n<h2>7. Retention</h2>\n<p>We store your data for as long as your account exists. After deletion, your account and associated data are fully removed within 30 days, unless statutory retention obligations apply.</p>\n\n<h2>8. Your rights</h2>\n<p>You have the right to access (Art. 15), rectification (Art. 16), erasure (Art. 17), restriction (Art. 18), data portability (Art. 20) and objection (Art. 21 GDPR). You can withdraw any consent with effect for the future at any time.</p>\n\n<h2 id=\"konto-loeschen\">9. Deleting your account and data</h2>\n<p>You can delete your account and all associated data at any time:</p>\n<ul>\n<li><b>In the app:</b> <b>Settings → Delete account</b>. After a confirmation prompt, deletion is triggered.</li>\n<li><b>By email:</b> request to <a href=\"mailto:info@boarlytics.com\">info@boarlytics.com</a>.</li>\n</ul>\n<p>This removes your user account and all stored content: territories, feeding stations, visits, baiting, locations and the forecasts derived from them. Deletion is complete and irreversible within 30 days. Mere deactivation (freezing) does not take place.</p>\n\n<h2>10. Deleting a single feeding station</h2>\n<p>You do not need to delete your whole account to remove individual entries. In the app you can delete a single feeding station together with its visits and forecasts: open the station in the <b>Overview</b> and choose <b>Delete</b> from the menu. Individual visit entries can be removed the same way. Deleted stations and entries are removed from your data.</p>\n\n<h2>11. Data export (CSV)</h2>\n<p>You can export your logged data yourself. Under <b>Settings → Export data</b> you receive your territories, feeding stations and visit entries as a CSV file. The format is readable in common programs (e.g. a spreadsheet) and serves both your own analysis and your right to data portability (Art. 20 GDPR).</p>\n\n<h2>12. Right to complain</h2>\n<p>You have the right to lodge a complaint with a data protection supervisory authority, in particular in the EU member state of your residence or the alleged infringement.</p>\n\n<h2>13. Changes to this policy</h2>\n<p>We update this policy when the legal situation or our processing changes. The current version is available in the app and at boarlytics.com/privacy.</p>", "fr": "<h1>Politique de Confidentialité</h1>\n<div class=\"meta\">Boar Forecast App · Boarlytics · Août 2026</div>\n<p>La protection de vos données nous tient à cœur. Cette politique explique quelles données personnelles nous traitons lors de l'utilisation de l'application « Boar Forecast », à quelles fins et sur quelle base légale.</p>\n\n<h2>1. Responsable du traitement</h2>\n<p>Boarlytics, Frieder Baumann – Softwareentwicklung Wildtiermanagement<br>c/o flexdienst – #20469, Kurt-Schumacher-Straße 76, 67663 Kaiserslautern, Allemagne<br>E-mail : <a href=\"mailto:info@boarlytics.com\">info@boarlytics.com</a></p>\n\n<h2>2. Principes</h2>\n<p>Nous ne traitons que les données nécessaires au fonctionnement de l'application. Nous ne vendons pas de données et n'affichons pas de publicité. Vos données de chasse restent les vôtres.</p>\n\n<h2>3. Données que nous traitons</h2>\n<ul>\n<li><b>Données de compte :</b> adresse e-mail et mot de passe chiffré pour la connexion.</li>\n<li><b>Preuve de consentement :</b> horodatage et version des conditions acceptées (sans adresse IP).</li>\n<li><b>Données de chasse et de territoire :</b> les territoires et agrainages que vous créez, les visites et agrainages enregistrés, et les prévisions calculées.</li>\n<li><b>Données de localisation :</b> les coordonnées de vos agrainages et territoires – saisies uniquement lorsque vous placez activement un lieu sur la carte, jamais en arrière-plan.</li>\n<li><b>Météo :</b> pour vos agrainages, nous récupérons des données météo localisées (direction du vent, température, précipitations, phase lunaire).</li>\n<li><b>Jeton push :</b> uniquement si vous activez les notifications.</li>\n<li><b>Diagnostics techniques :</b> rapports de plantage anonymisés pour améliorer la stabilité.</li>\n</ul>\n\n<h2>4. Finalités et bases légales</h2>\n<p>Nous traitons vos données pour fournir l'application et calculer la prévision de visite (exécution du contrat, art. 6(1)(b) RGPD). Le diagnostic d'erreurs et la sécurité d'exploitation reposent sur notre intérêt légitime à un service stable (art. 6(1)(f) RGPD). Les fonctions optionnelles comme les notifications push reposent sur votre consentement (art. 6(1)(a) RGPD), révocable à tout moment.</p>\n\n<h2>5. Hébergement et sous-traitants</h2>\n<p>Nous faisons appel à des prestataires soigneusement sélectionnés en tant que sous-traitants :</p>\n<ul>\n<li><b>Google Firebase</b> (Google Ireland Ltd.) pour l'authentification, la base de données (Firestore) et, le cas échéant, les notifications. Les données sont stockées dans un centre de données de l'UE (Francfort).</li>\n<li><b>Surveillance des erreurs</b> pour des rapports de plantage anonymisés.</li>\n<li><b>Service de données météo</b> pour récupérer la météo localisée.</li>\n<li><b>Google Play / Apple App Store</b> pour le traitement des paiements.</li>\n</ul>\n<p>Des accords de sous-traitance (art. 28 RGPD) sont conclus lorsque nécessaire. Tout transfert vers des pays tiers est encadré par des garanties appropriées (notamment les clauses contractuelles types de l'UE).</p>\n\n<h2>6. Paiements</h2>\n<p>Les achats (par ex. le déblocage unique Wind) sont traités via Google Play Billing ou Apple In-App Purchase. Nous ne recevons pas les données de paiement complètes, seulement l'information de réussite de l'achat.</p>\n\n<h2>7. Durée de conservation</h2>\n<p>Nous conservons vos données tant que votre compte existe. Après suppression, votre compte et les données associées sont entièrement supprimés sous 30 jours, sauf obligation légale de conservation.</p>\n\n<h2>8. Vos droits</h2>\n<p>Vous disposez des droits d'accès (art. 15), de rectification (art. 16), d'effacement (art. 17), de limitation (art. 18), de portabilité (art. 20) et d'opposition (art. 21 RGPD). Vous pouvez retirer tout consentement à tout moment pour l'avenir.</p>\n\n<h2 id=\"konto-loeschen\">9. Suppression du compte et des données</h2>\n<p>Vous pouvez supprimer votre compte et toutes les données associées à tout moment :</p>\n<ul>\n<li><b>Dans l'application :</b> <b>Réglages → Supprimer le compte</b>. Après une confirmation, la suppression est déclenchée.</li>\n<li><b>Par e-mail :</b> demande à <a href=\"mailto:info@boarlytics.com\">info@boarlytics.com</a>.</li>\n</ul>\n<p>Sont supprimés votre compte et tout le contenu enregistré : territoires, agrainages, visites, agrainages, positions et prévisions dérivées. La suppression est complète et irréversible sous 30 jours. Aucune simple désactivation (gel) n'a lieu.</p>\n\n<h2>10. Supprimer un agrainage</h2>\n<p>Vous n'avez pas besoin de supprimer tout votre compte pour retirer des entrées individuelles. Dans l'application, vous pouvez supprimer un agrainage avec ses visites et prévisions : ouvrez l'agrainage dans l'<b>Aperçu</b> et choisissez <b>Supprimer</b> dans le menu. Les entrées de visite individuelles se suppriment de la même façon. Les agrainages et entrées supprimés sont retirés de vos données.</p>\n\n<h2>11. Export des données (CSV)</h2>\n<p>Vous pouvez exporter vous-même vos données enregistrées. Sous <b>Réglages → Exporter les données</b>, vous obtenez vos territoires, agrainages et entrées de visite sous forme de fichier CSV. Le format est lisible dans les programmes courants (par ex. un tableur) et sert à votre propre analyse ainsi qu'à votre droit à la portabilité (art. 20 RGPD).</p>\n\n<h2>12. Droit de réclamation</h2>\n<p>Vous avez le droit d'introduire une réclamation auprès d'une autorité de contrôle, notamment dans l'État membre de l'UE de votre résidence ou de la violation présumée.</p>\n\n<h2>13. Modifications de cette politique</h2>\n<p>Nous adaptons cette politique lorsque la situation juridique ou notre traitement évolue. La version en vigueur est disponible dans l'application et sur boarlytics.com/confidentialite.</p>"};
const LAB={"de": {"back": "Zur Startseite", "agb": "AGB", "ds": "Datenschutz", "imp": "Impressum"}, "en": {"back": "Home", "agb": "Terms", "ds": "Privacy", "imp": "Legal Notice"}, "fr": {"back": "Accueil", "agb": "CGU", "ds": "Confidentialité", "imp": "Mentions légales"}};

  document.documentElement.lang=lang;

}
