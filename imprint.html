<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
  :root { --bg:#0d1410;--bg2:#111a14;--green:#4a8c3f;--green-light:#6ab85f;--text:#e8ede6;--text-muted:#8a9e87;--border:#1e2e1e;--card:#131d14; }
  * { margin:0;padding:0;box-sizing:border-box; }
  body { background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:16px;line-height:1.7; }
  nav { position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(13,20,16,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 5vw;display:flex;align-items:center;justify-content:space-between;height:64px; }

  .page { max-width:720px;margin:0 auto;padding:100px 5vw 80px; }
  .page-tag { display:inline-block;background:rgba(74,140,63,0.15);border:1px solid rgba(74,140,63,0.3);color:var(--green-light);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:6px 14px;border-radius:20px;margin-bottom:24px; }
  h1 { font-size:2.2rem;font-weight:900;letter-spacing:-.02em;margin-bottom:40px; }
  h2 { font-size:1.1rem;font-weight:700;margin:40px 0 12px;color:var(--green-light); }
  p { color:var(--text-muted);margin-bottom:12px; }
  a { color:var(--green-light);text-decoration:none; }
  .card { background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;margin-bottom:24px; }
  footer { background:var(--bg);border-top:1px solid var(--border);padding:32px 5vw;text-align:center;font-size:.85rem;color:var(--text-muted); }
</style>
